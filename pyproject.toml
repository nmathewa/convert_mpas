[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "convert-mpas"
version = "0.1.0"
description = "Python port of convert_mpas"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "netCDF4",
]

[project.scripts]
convert-mpas = "convert_mpas.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
